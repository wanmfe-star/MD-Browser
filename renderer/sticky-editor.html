<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'"><title>桌面便签</title><link rel="stylesheet" href="./sticky.css"></head>
<body class="sticky-editor">
<div id="quickHandle" class="quick-handle" aria-label="拖动便签" title="解锁后可拖动" hidden></div>
<header><input id="title" aria-label="便签标题" placeholder="标题">
  <div class="sticky-actions">
    <button class="sticky-icon" id="new-note" aria-label="新建便签" title="新建便签"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="sticky-icon" id="pin" aria-label="置顶窗口" title="置顶窗口" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6-2 1-3 3-1 4-3.5-3.5L5 20l-1-1 6.5-6.5L7 9l4-1 3-3z"/></svg></button>
    <button class="sticky-icon" id="lock" aria-label="锁定位置" title="锁定位置" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path class="shackle-closed" d="M8 10V7a4 4 0 0 1 8 0v3"/><path class="shackle-open" d="M8 10V7a4 4 0 0 1 7.8-1.3"/><path d="M12 14v3"/></svg></button>
  </div>
</header>
<textarea id="body" aria-label="便签正文" placeholder="写下你的想法…" spellcheck="false"></textarea>
<label class="tag-field">标签<input id="tags" list="commonTags" placeholder="用逗号分隔多个标签"><datalist id="commonTags"><option>随想</option><option>法义</option><option>产品创意</option></datalist></label>
<footer role="status"><span id="local"></span><span id="backup"></span><button id="wall" hidden>便签墙</button></footer>
<script src="./sticky-editor.js"></script></body></html>
